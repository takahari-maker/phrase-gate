<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHRASE GATE — 場面別フレーズ練習</title>
<meta name="theme-color" content="#0E2437">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phrase Gate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2437;
    --ink-2:#1B3A55;
    --paper:#E8EBEF;
    --card:#FFFFFF;
    --amber:#FFB100;
    --ok:#0E8A6A;
    --no:#D0453D;
    --mute:#7A8AA0;
    --line:#C9D1DA;
    --pad:16px;
    --r:14px;
    --board:'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body:'Lexend', system-ui, sans-serif;
    --jp:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic', 'Noto Sans JP', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--jp);
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 var(--pad) 40px}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--ink);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  }
  .topbar-inner{max-width:520px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between}
  .brand{font-family:var(--board);font-weight:700;font-size:20px;letter-spacing:.22em;text-transform:uppercase}
  .brand span{color:var(--amber)}
  .streak{font-family:var(--board);font-size:15px;letter-spacing:.1em;color:#9FB3C8}
  .streak b{color:var(--amber);font-size:18px;margin:0 2px}

  /* ---------- split-flap board (signature) ---------- */
  .board{
    background:var(--ink);border-radius:var(--r);
    padding:18px 14px 16px;margin-top:14px;
  }
  .board-eyebrow{
    font-family:var(--board);font-size:13px;letter-spacing:.28em;
    color:#7E9AB5;text-transform:uppercase;margin-bottom:10px
  }
  .flap{display:flex;gap:4px;flex-wrap:wrap}
  .flap-cell{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    min-width:26px;height:38px;padding:0 3px;
    background:#071A2B;border-radius:3px;
    font-family:var(--board);font-weight:600;font-size:27px;line-height:1;
    color:var(--amber);
  }
  .flap-cell::after{
    content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)
  }
  .board-sub{margin-top:10px;color:#9FB3C8;font-size:13px}
  .board-sub b{color:#fff}

  /* ---------- generic ---------- */
  .label{
    font-family:var(--board);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--mute);margin:22px 0 8px
  }
  .card{background:var(--card);border-radius:var(--r);padding:18px}
  .btn{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    font-family:var(--jp);font-size:16px;font-weight:600;
    background:var(--ink);color:#fff;border-radius:10px;padding:15px 18px;width:100%;
  }
  .btn:active{transform:translateY(1px)}
  .btn.amber{background:var(--amber);color:var(--ink)}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.small{font-size:14px;padding:11px 14px;width:auto}
  .btn[disabled]{opacity:.4;cursor:default}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

  /* ---------- scene chips ---------- */
  .scenes{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    -webkit-appearance:none;appearance:none;border:1.5px solid var(--line);background:transparent;
    border-radius:999px;padding:9px 14px;font-family:var(--jp);font-size:14px;color:var(--ink);cursor:pointer
  }
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip small{color:var(--mute);margin-left:6px}
  .chip[aria-pressed="true"] small{color:#9FB3C8}

  /* ---------- step blocks ---------- */
  .step{background:var(--card);border-radius:var(--r);margin-top:12px;overflow:hidden}
  .step-head{display:flex;align-items:center;gap:10px;padding:14px 16px}
  .step-num{
    font-family:var(--board);font-weight:700;font-size:15px;letter-spacing:.06em;
    width:26px;height:26px;border-radius:50%;background:var(--paper);color:var(--mute);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto
  }
  .step[data-state="active"] .step-num{background:var(--ink);color:var(--amber)}
  .step[data-state="done"] .step-num{background:var(--ok);color:#fff}
  .step-title{font-size:15px;font-weight:600}
  .step[data-state="locked"] .step-title{color:var(--mute)}
  .step-note{margin-left:auto;font-size:13px;color:var(--mute)}
  .step-body{padding:0 16px 18px;display:none}
  .step[data-state="active"] .step-body{display:block}

  .ja-big{font-size:21px;line-height:1.55;font-weight:600;margin:2px 0 16px}
  .en-big{font-family:var(--body);font-size:22px;line-height:1.5;font-weight:400;margin:2px 0 14px}

  /* ---------- word chips ---------- */
  .slots{
    min-height:64px;border:2px dashed var(--line);border-radius:10px;
    padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-bottom:12px
  }
  .slots.wrong{border-color:var(--no);animation:shake .3s}
  .slots.right{border-style:solid;border-color:var(--ok)}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .pool{display:flex;flex-wrap:wrap;gap:6px}
  .word{
    -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
    font-family:var(--body);font-size:17px;font-weight:400;
    background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 12px
  }
  .word.placed{background:var(--ink);color:#fff}
  .word.used{visibility:hidden}

  /* ---------- speak ---------- */
  .mic{
    width:100%;border:0;border-radius:10px;padding:18px;cursor:pointer;
    background:var(--ink);color:#fff;font-family:var(--jp);font-size:16px;font-weight:600
  }
  .mic.rec{background:var(--no);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.72}}
  .score{margin-top:14px;text-align:center}
  .score-num{font-family:var(--board);font-size:52px;font-weight:700;line-height:1}
  .score-num.good{color:var(--ok)} .score-num.mid{color:var(--amber)} .score-num.low{color:var(--no)}
  .heard{font-family:var(--body);font-size:15px;color:var(--mute);margin-top:6px;word-break:break-word}
  .notice{font-size:13px;color:var(--mute);line-height:1.6;margin-top:10px}

  .footer-actions{margin-top:18px}
  .progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px}
  .progress i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}
  .hidden{display:none !important}
  .center{text-align:center}
  .muted{color:var(--mute);font-size:13px;line-height:1.7}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Phrase<span>·</span>Gate</div>
    <div class="streak" id="streakBox"></div>
  </div>
</header>

<main class="wrap">

  <!-- ============ HOME ============ -->
  <section id="home">
    <div class="board">
      <div class="board-eyebrow">Today's gate</div>
      <div class="flap" id="flapHome"></div>
      <div class="board-sub" id="homeSub"></div>
    </div>

    <div class="label">場面を選ぶ</div>
    <div class="scenes" id="sceneChips"></div>

    <div class="footer-actions">
      <button class="btn amber" id="startBtn">練習を始める</button>
    </div>
    <p class="muted" style="margin-top:14px">
      聞く → 並べ替える → 声に出す、の3段で1フレーズ。<br>
      「できた」を押すと次に出る間隔が伸びます（1日 → 2日 → 4日 …）。
    </p>
  </section>

  <!-- ============ SESSION ============ -->
  <section id="session" class="hidden">
    <div class="board">
      <div class="board-eyebrow" id="sesEyebrow">Now boarding</div>
      <div class="flap" id="flapSes"></div>
      <div class="board-sub" id="sesSub"></div>
      <div class="progress"><i id="bar"></i></div>
    </div>

    <!-- step 1 -->
    <div class="step" id="step1" data-state="active">
      <div class="step-head">
        <div class="step-num">1</div>
        <div class="step-title">聞く</div>
        <div class="step-note" id="note1"></div>
      </div>
      <div class="step-body">
        <p class="ja-big" id="jaText"></p>
        <div class="row">
          <button class="btn ghost" id="playBtn">▶ 聞く</button>
          <button class="btn ghost" id="slowBtn">▶ ゆっくり</button>
        </div>
        <div class="footer-actions">
          <button class="btn" id="toStep2">並べ替えに進む</button>
        </div>
        <p class="notice">英文はまだ出しません。音と意味だけで覚えます。</p>
      </div>
    </div>

    <!-- step 2 -->
    <div class="step" id="step2" data-state="locked">
      <div class="step-head">
        <div class="step-num">2</div>
        <div class="step-title">並べ替える</div>
        <div class="step-note" id="note2"></div>
      </div>
      <div class="step-body">
        <div class="slots" id="slots"></div>
        <div class="pool" id="pool"></div>
        <div class="row" style="margin-top:14px">
          <button class="btn ghost small" id="hintBtn">ヒント</button>
          <button class="btn ghost small" id="resetBtn">やり直す</button>
          <button class="btn ghost small" id="replayBtn">▶ 聞く</button>
        </div>
      </div>
    </div>

    <!-- step 3 -->
    <div class="step" id="step3" data-state="locked">
      <div class="step-head">
        <div class="step-num">3</div>
        <div class="step-title">声に出す</div>
        <div class="step-note" id="note3"></div>
      </div>
      <div class="step-body">
        <p class="en-big" id="enText"></p>
        <button class="btn ghost" id="playBtn2" style="margin-bottom:10px">▶ お手本を聞く</button>
        <button class="mic" id="micBtn">● 話す</button>
        <div class="score hidden" id="scoreBox">
          <div class="score-num" id="scoreNum">0</div>
          <div class="muted">一致率</div>
          <div class="heard" id="heardText"></div>
        </div>
        <p class="notice hidden" id="micNotice"></p>
      </div>
    </div>

    <div class="footer-actions row" id="judgeRow">
      <button class="btn ghost" id="againBtn">もう一度</button>
      <button class="btn amber" id="okBtn">できた</button>
    </div>
    <div class="center" style="margin-top:14px">
      <button class="btn ghost small" id="quitBtn">中断してもどる</button>
    </div>
  </section>

  <!-- ============ DONE ============ -->
  <section id="done" class="hidden">
    <div class="board">
      <div class="board-eyebrow">Arrived</div>
      <div class="flap" id="flapDone"></div>
      <div class="board-sub" id="doneSub"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="ja-big" id="doneMsg" style="margin-bottom:8px"></p>
      <p class="muted" id="doneDetail"></p>
    </div>
    <div class="footer-actions">
      <button class="btn amber" id="homeBtn">ホームにもどる</button>
    </div>
  </section>

</main>

<script>

/* =========================================================
   2. 保存（localStorage）
   ========================================================= */
const KEY = 'phrasegate.v1';
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];   // レベル別 次回までの日数
const SESSION_SIZE = 10;

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const addDays = (n) => {
  const d = new Date(); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const dayDiff = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {cards:{}, streak:{count:0, last:null}, scene:'all', doneToday:0, doneDate:null};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function cardOf(id){
  if(!state.cards[id]) state.cards[id] = {level:0, due:today(), seen:0};
  return state.cards[id];
}
function duePhrases(sceneId){
  const t = today();
  return PHRASES.filter(p => (sceneId==='all' || p.s===sceneId))
    .filter(p => {
      const c = state.cards[p.id];
      return !c || c.due <= t;
    });
}
function touchStreak(){
  const t = today();
  if(state.streak.last === t) return;
  if(state.streak.last && dayDiff(state.streak.last, t) === 1) state.streak.count++;
  else state.streak.count = 1;
  state.streak.last = t;
  save();
}

/* =========================================================
   3. 音声（読み上げ・認識）
   ========================================================= */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  if(!vs.length) return null;
  return vs.find(v => /US/i.test(v.lang) && /Samantha|Google|Natural|Aria/i.test(v.name))
      || vs.find(v => /US/i.test(v.lang)) || vs[0];
}
if('speechSynthesis' in window){
  voice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || 0.95;
  if(!voice) voice = pickVoice();
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recording = false;

function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
}
function lcsLen(a,b){
  const dp = Array.from({length:a.length+1}, () => new Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  }
  return dp[a.length][b.length];
}
function similarity(target, heard){
  const t = normalize(target), h = normalize(heard);
  if(!t.length) return 0;
  return Math.round(lcsLen(t,h) / t.length * 100);
}

/* =========================================================
   4. スプリットフラップ表示（看板）
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function setFlap(el, text){
  el.innerHTML = '';
  text.split('').forEach((ch, i) => {
    const cell = document.createElement('span');
    cell.className = 'flap-cell';
    cell.textContent = ch === ' ' ? '\u00A0' : ch;
    el.appendChild(cell);
    if(!reduceMotion && ch !== ' '){
      let n = 0; const steps = 5 + i*2;
      const timer = setInterval(() => {
        cell.textContent = POOL[Math.floor(Math.random()*POOL.length)];
        if(++n >= steps){ clearInterval(timer); cell.textContent = ch; }
      }, 45);
    }
  });
}

/* =========================================================
   5. 画面
   ========================================================= */
const $ = id => document.getElementById(id);
const views = {home:$('home'), session:$('session'), done:$('done')};
function show(name){
  Object.entries(views).forEach(([k,el]) => el.classList.toggle('hidden', k!==name));
  window.scrollTo(0,0);
}
function renderStreak(){
  const n = state.streak.count || 0;
  $('streakBox').innerHTML = n ? `連続 <b>${n}</b> 日` : '今日から';
}

function renderHome(){
  renderStreak();
  const scene = state.scene || 'all';
  const label = scene === 'all' ? 'ALL' : SCENES.find(s=>s.id===scene).code;
  setFlap($('flapHome'), label);
  const due = duePhrases(scene).length;
  const total = PHRASES.filter(p => scene==='all' || p.s===scene).length;
  $('homeSub').innerHTML = due
    ? `今日の出番 <b>${Math.min(due, SESSION_SIZE)}</b> フレーズ ／ 全 ${total}`
    : `今日の分は終わりです ／ 全 ${total}`;
  $('startBtn').textContent = due ? '練習を始める' : '復習は明日から（先に進む）';

  const box = $('sceneChips');
  box.innerHTML = '';
  const list = [{id:'all', name:'すべて'}].concat(SCENES);
  list.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(s.id === scene));
    const d = duePhrases(s.id).length;
    b.innerHTML = `${s.name}<small>${d}</small>`;
    b.onclick = () => { state.scene = s.id; save(); renderHome(); };
    box.appendChild(b);
  });
}

/* ---------- セッション ---------- */
let queue = [], current = null, index = 0, spoke = false;

function startSession(){
  const scene = state.scene || 'all';
  let list = duePhrases(scene);
  if(!list.length){
    // 期限前でも先に進みたいとき：次回が近い順に出す
    list = PHRASES.filter(p => scene==='all' || p.s===scene)
      .sort((a,b) => (cardOf(a.id).due > cardOf(b.id).due ? 1 : -1));
  }
  queue = list.slice(0, SESSION_SIZE);
  if(!queue.length) return;
  index = 0;
  touchStreak();
  if(state.doneDate !== today()){ state.doneDate = today(); state.doneToday = 0; save(); }
  show('session');
  loadCard();
}

function loadCard(){
  current = queue[index];
  spoke = false;
  const scene = SCENES.find(s => s.id === current.s);
  setFlap($('flapSes'), scene.code);
  $('sesSub').innerHTML = `${scene.name} ／ <b>${index+1}</b> / ${queue.length}`;
  $('bar').style.width = (index / queue.length * 100) + '%';

  setStep(1);
  $('jaText').textContent = current.ja;
  $('enText').textContent = current.en;
  $('note1').textContent = '';
  $('note2').textContent = '';
  $('note3').textContent = '';
  $('scoreBox').classList.add('hidden');
  $('heardText').textContent = '';
  buildWords();
  setTimeout(() => speak(current.en), 250);
}

function setStep(n){
  [1,2,3].forEach(i => {
    const el = $('step'+i);
    el.dataset.state = i < n ? 'done' : (i === n ? 'active' : 'locked');
  });
  $('judgeRow').classList.toggle('hidden', n < 3);
}

/* ---------- 並べ替え ---------- */
let tokens = [], placed = [];
function buildWords(){
  tokens = current.en.split(' ');
  placed = [];
  const order = tokens.map((w,i) => ({w, i})).sort(() => Math.random() - 0.5);
  const pool = $('pool'); pool.innerHTML = '';
  order.forEach(o => {
    const b = document.createElement('button');
    b.className = 'word'; b.textContent = o.w; b.dataset.i = o.i;
    b.onclick = () => { placed.push(o.i); b.classList.add('used'); drawSlots(); };
    pool.appendChild(b);
  });
  drawSlots();
}
function drawSlots(){
  const slots = $('slots');
  slots.className = 'slots';
  slots.innerHTML = '';
  placed.forEach((idx, pos) => {
    const b = document.createElement('button');
    b.className = 'word placed'; b.textContent = tokens[idx];
    b.onclick = () => {
      placed.splice(pos,1);
      document.querySelector(`.pool .word[data-i="${idx}"]`).classList.remove('used');
      drawSlots();
    };
    slots.appendChild(b);
  });
  if(placed.length === tokens.length) checkOrder();
}
function checkOrder(){
  const answer = placed.map(i => tokens[i]).join(' ');
  const slots = $('slots');
  if(answer === current.en){
    slots.classList.add('right');
    $('note2').textContent = '正解';
    setTimeout(() => { setStep(3); speak(current.en); }, 500);
  }else{
    slots.classList.add('wrong');
    $('note2').textContent = 'もう一度';
  }
}

/* ---------- 発話 ---------- */
function setupMic(){
  if(!SR){
    $('micBtn').disabled = true;
    $('micBtn').textContent = '音声認識が使えません';
    $('micNotice').classList.remove('hidden');
    $('micNotice').textContent = 'この端末では音声認識が使えません。お手本を聞いて声に出したら、下の「できた」を押してください。iPhoneの場合は 設定 › 一般 › キーボード の音声入力をオンにすると使えることがあります。';
    return;
  }
  recog = new SR();
  recog.lang = 'en-US';
  recog.interimResults = false;
  recog.maxAlternatives = 3;

  recog.onresult = (e) => {
    let best = 0, bestText = '';
    for(let i=0;i<e.results[0].length;i++){
      const t = e.results[0][i].transcript;
      const s = similarity(current.en, t);
      if(s > best){ best = s; bestText = t; }
    }
    showScore(best, bestText);
  };
  recog.onerror = (e) => {
    stopRec();
    $('micNotice').classList.remove('hidden');
    $('micNotice').textContent = e.error === 'not-allowed'
      ? 'マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。'
      : '聞き取れませんでした。もう一度試してください。';
  };
  recog.onend = () => stopRec();
}
function stopRec(){
  recording = false;
  $('micBtn').classList.remove('rec');
  $('micBtn').textContent = spoke ? '● もう一度話す' : '● 話す';
}
function showScore(score, heard){
  spoke = true;
  $('scoreBox').classList.remove('hidden');
  const num = $('scoreNum');
  num.textContent = score;
  num.className = 'score-num ' + (score >= 80 ? 'good' : score >= 50 ? 'mid' : 'low');
  $('heardText').textContent = heard ? `聞こえた文：${heard}` : '';
  $('note3').textContent = score + '%';
}

/* ---------- 採点して次へ ---------- */
function judge(ok){
  const c = cardOf(current.id);
  c.seen++;
  if(ok){
    c.level = Math.min(c.level + 1, INTERVALS.length - 1);
    c.due = addDays(INTERVALS[c.level]);
    state.doneToday = (state.doneToday || 0) + 1;
  }else{
    c.level = Math.max(0, c.level - 1);
    c.due = today();
    queue.push(current);   // 同じセッションの最後にもう一度
  }
  save();
  index++;
  if(index >= queue.length) finish();
  else loadCard();
}

function finish(){
  show('done');
  setFlap($('flapDone'), 'DONE');
  const t = today();
  const tomorrow = PHRASES.filter(p => state.cards[p.id] && state.cards[p.id].due === addDays(1)).length;
  const remaining = duePhrases(state.scene || 'all').length;
  $('doneSub').innerHTML = `連続 <b>${state.streak.count}</b> 日目`;
  $('doneMsg').textContent = `${state.doneToday} フレーズ、覚えました。`;
  $('doneDetail').innerHTML = remaining
    ? `今日はあと ${remaining} フレーズ残っています。`
    : `明日は ${tomorrow} フレーズが出番です。`;
  $('bar').style.width = '100%';
}

/* =========================================================
   6. 配線
   ========================================================= */
$('startBtn').onclick = () => { speak(' '); startSession(); };  // iOSの音声解錠を兼ねる
$('playBtn').onclick  = () => speak(current.en);
$('playBtn2').onclick = () => speak(current.en);
$('slowBtn').onclick  = () => speak(current.en, 0.65);
$('replayBtn').onclick= () => speak(current.en);
$('toStep2').onclick  = () => setStep(2);
$('resetBtn').onclick = () => buildWords();
$('hintBtn').onclick  = () => {
  buildWords();
  const n = Math.min(2, tokens.length);
  for(let i=0;i<n;i++){
    placed.push(i);
    document.querySelector(`.pool .word[data-i="${i}"]`).classList.add('used');
  }
  drawSlots();
};
$('micBtn').onclick = () => {
  if(!recog) return;
  if(recording){ recog.stop(); return; }
  $('micNotice').classList.add('hidden');
  try{
    recog.start();
    recording = true;
    $('micBtn').classList.add('rec');
    $('micBtn').textContent = '● 聞いています…（押すと停止）';
  }catch(e){ stopRec(); }
};
$('okBtn').onclick    = () => judge(true);
$('againBtn').onclick = () => judge(false);
$('quitBtn').onclick  = () => { speechSynthesis.cancel(); show('home'); renderHome(); };
$('homeBtn').onclick  = () => { show('home'); renderHome(); };

setupMic();
renderHome();
</script>

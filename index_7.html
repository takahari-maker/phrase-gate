<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHRASE GATE — 場面別フレーズ練習</title>
<meta name="theme-color" content="#2A2340">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Phrase Gate">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2A2340;
    --ink-2:#3A3157;
    --paper:#FFF7EC;
    --card:#FFFFFF;
    --amber:#FFC93C;
    --pink:#FF5D7A;
    --ok:#22C6A0;
    --no:#FF5D7A;
    --mute:#8E869E;
    --line:#D8D0E6;
    --pad:16px;
    --r:20px;
    --sh:4px 4px 0 var(--ink);
    --sh-sm:3px 3px 0 var(--ink);
    --board:'Fredoka', sans-serif;
    --body:'Fredoka', sans-serif;
    --jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--jp);
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 var(--pad) 40px}

  /* ---------- top bar ---------- */
  .topbar{
    background:var(--ink);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  }
  .topbar-inner{max-width:520px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between}
  .brand{font-family:var(--board);font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
  .brand span{color:var(--amber)}
  .topbar-right{display:flex;align-items:center;gap:8px}
  .rate-btn{
    background:var(--amber);border:2px solid var(--ink);color:var(--ink);border-radius:999px;
    padding:4px 11px;font-family:var(--board);font-size:13px;font-weight:600;cursor:pointer
  }
  .streak{
    font-family:var(--board);font-size:13px;font-weight:600;color:#fff;
    background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:4px 11px
  }
  .streak b{color:#fff;font-size:15px;margin:0 2px}

  /* ---------- split-flap board (signature) ---------- */
  .board{
    background:var(--amber);border:3px solid var(--ink);border-radius:var(--r);
    padding:16px 14px 15px;margin-top:14px;box-shadow:var(--sh);
  }
  .board-eyebrow{
    font-family:var(--board);font-size:12px;letter-spacing:.14em;font-weight:600;
    color:var(--ink);opacity:.65;text-transform:uppercase;margin-bottom:8px
  }
  .flap{display:flex;gap:4px;flex-wrap:wrap}
  .flap-cell{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    min-width:28px;height:40px;padding:0 4px;
    background:var(--ink);border-radius:7px;
    font-family:var(--board);font-weight:600;font-size:26px;line-height:1;
    color:var(--amber);
  }
  .board-sub{margin-top:9px;color:var(--ink);font-size:13px;font-weight:500}
  .board-sub b{font-size:17px;font-weight:700}

  /* ---------- generic ---------- */
  .label{
    font-family:var(--jp);font-size:14px;font-weight:700;
    color:var(--ink);margin:20px 0 8px
  }
  .card{
    background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
    padding:16px;box-shadow:var(--sh)
  }
  .btn{
    -webkit-appearance:none;appearance:none;cursor:pointer;
    font-family:var(--jp);font-size:16px;font-weight:700;
    background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;
    padding:14px 16px;width:100%;box-shadow:var(--sh)
  }
  .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .btn.amber{background:var(--pink);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.small{font-size:14px;padding:11px 12px;width:auto;border-radius:13px;box-shadow:var(--sh-sm)}
  .btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--pink);outline-offset:2px}

  /* ---------- scene chips ---------- */
  .scenes{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    -webkit-appearance:none;appearance:none;border:3px solid var(--ink);background:#fff;
    border-radius:999px;padding:7px 13px;font-family:var(--jp);font-size:14px;font-weight:500;
    color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)
  }
  .chip:active{transform:translate(2px,2px);box-shadow:none}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff}
  .chip small{color:var(--mute);margin-left:6px;font-family:var(--board)}
  .chip[aria-pressed="true"] small{color:var(--amber)}

  /* ---------- step blocks ---------- */
  .step{
    background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
    margin-top:12px;overflow:hidden;box-shadow:var(--sh)
  }
  .step[data-state="done"]{opacity:.55;box-shadow:var(--sh-sm)}
  .step-head{display:flex;align-items:center;gap:10px;padding:13px 15px}
  .step-num{
    font-family:var(--board);font-weight:600;font-size:15px;
    width:28px;height:28px;border-radius:50%;background:#fff;color:var(--mute);
    border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto
  }
  .step[data-state="active"] .step-num{background:var(--ink);color:var(--amber)}
  .step[data-state="done"] .step-num{background:var(--ok);color:#fff}
  .step-title{font-size:15px;font-weight:700}
  .step[data-state="locked"] .step-title{color:var(--mute)}
  .step-note{margin-left:auto;font-size:13px;color:var(--mute)}
  .step-body{padding:0 16px 18px;display:none}
  .step[data-state="active"] .step-body{display:block}

  .ja-big{font-size:20px;line-height:1.6;font-weight:700;margin:2px 0 14px}
  .en-big{font-family:var(--body);font-size:22px;line-height:1.45;font-weight:500;margin:2px 0 6px}
  .ja-sub{font-size:14px;color:var(--mute);line-height:1.7;margin:0 0 14px;font-weight:500}

  /* ---------- speak ---------- */
  .mic{
    width:100%;border:3px solid var(--ink);border-radius:16px;padding:16px;cursor:pointer;
    background:var(--pink);color:#fff;font-family:var(--jp);font-size:16px;font-weight:700;
    box-shadow:var(--sh)
  }
  .mic:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .mic.rec{background:var(--ink);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.7}}
  .score{
    margin-top:14px;text-align:center;background:var(--ok);color:#fff;
    border:3px solid var(--ink);border-radius:var(--r);padding:12px;box-shadow:var(--sh)
  }
  .score .muted{color:#0B4F3E;font-weight:700}
  .score-num{font-family:var(--board);font-size:46px;font-weight:700;line-height:1;color:#fff}
  .score-num.good{color:#fff} .score-num.mid{color:#fff} .score-num.low{color:#fff}
  .heard{font-family:var(--body);font-size:15px;color:var(--mute);margin-top:6px;word-break:break-word}
  .notice{font-size:13px;color:var(--mute);line-height:1.6;margin-top:10px}

  .footer-actions{margin-top:18px}
  .progress{
    height:11px;background:#fff;border:2px solid var(--ink);border-radius:999px;
    overflow:hidden;margin-top:12px
  }
  .progress i{display:block;height:100%;background:var(--pink);width:0;transition:width .3s}

  /* ---------- reader ---------- */
  .story-item{
    background:var(--card);border:3px solid var(--ink);border-radius:var(--r);
    padding:15px;margin-top:10px;box-shadow:var(--sh);
    cursor:pointer;width:100%;text-align:left;font-family:var(--jp)
  }
  .story-item:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
  .story-item h3{margin:0 0 4px;font-family:var(--board);font-size:19px;font-weight:600;color:var(--ink)}
  .story-item p{margin:0;font-size:13px;color:var(--mute)}
  .story-title{font-family:var(--board);font-size:22px;font-weight:600;margin-bottom:4px}
  .story-ja{font-size:13px;color:var(--mute);margin-bottom:14px}
  .reader{font-family:var(--body);font-size:18px;line-height:1.95;font-weight:400}
  .reader p{margin:0 0 8px}
  .para-ja{
    font-family:var(--jp);font-size:13px;line-height:1.8;color:#6B6480;
    background:#F4EFFA;border-radius:12px;padding:9px 11px;margin:0 0 18px
  }
  .w{cursor:pointer;border-radius:5px;padding:1px 0;border-bottom:2px dotted #C6BFD6}
  .w:active{background:var(--amber)}
  .w.marked{background:#FFE9AE;border-bottom:3px solid var(--amber)}
  .w.known{color:var(--mute);border-bottom-color:transparent}
  .sent{border-radius:6px}
  .sent.cur{background:var(--amber);box-shadow:0 0 0 4px var(--amber)}
  .idm{cursor:pointer;background:#C9F5E7;border-bottom:3px solid var(--ok);border-radius:5px 5px 0 0;padding:0 2px}
  .idm.marked{background:#8FE8CC}
  .idm.known{color:var(--mute);background:#EFEDF4;border-bottom-color:var(--line)}

  .shadowbar{
    position:sticky;bottom:0;z-index:20;margin-top:14px;
    background:var(--ink);border:3px solid var(--ink);border-radius:var(--r);padding:12px
  }
  .shadow-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .shadow-count{font-family:var(--board);font-size:13px;font-weight:600;color:#B6ADCB}
  .shadow-score{margin-left:auto;font-family:var(--board);font-size:22px;font-weight:700;color:var(--amber)}
  .ja-toggle{
    background:var(--amber);border:2px solid var(--ink);color:var(--ink);border-radius:999px;
    padding:4px 11px;font-family:var(--jp);font-size:12px;font-weight:700;cursor:pointer
  }
  .shadow-ja{
    color:#fff;font-size:14px;line-height:1.7;background:var(--ink-2);
    border-radius:11px;padding:9px 11px;margin-bottom:9px
  }
  .shadow-ja:empty{display:none}
  .shadow-idm{margin-bottom:9px}
  .shadow-idm:empty{display:none}
  .shadow-idm .ln{
    display:flex;gap:9px;align-items:baseline;background:var(--ink-2);
    border-radius:11px;padding:7px 11px;margin-top:6px
  }
  .shadow-idm .ln b{font-family:var(--body);font-weight:500;font-size:14px;color:#7DF0CB;flex:0 0 auto}
  .shadow-idm .ln span{font-size:12.5px;color:#C9C2DA}
  .sbtn{
    -webkit-appearance:none;appearance:none;cursor:pointer;flex:1;
    background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:13px;
    padding:11px 4px;font-family:var(--jp);font-size:14px;font-weight:700;
    box-shadow:2px 2px 0 #000
  }
  .sbtn:active{transform:translate(2px,2px);box-shadow:none}
  .sbtn.main{background:var(--pink);color:#fff}
  .sbtn.rec{background:var(--amber);color:var(--ink)}
  .sbtn.nav{flex:0 0 46px;font-family:var(--board);font-size:16px}
  .sbtn[disabled]{opacity:.35;box-shadow:none}

  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 12px 12px}
  .sheet-inner{
    max-width:496px;margin:0 auto;background:var(--ink);color:#fff;
    border:3px solid var(--ink);border-radius:var(--r);padding:18px 16px 16px;position:relative;
    box-shadow:0 -8px 30px rgba(42,35,64,.3)
  }
  .sheet-close{
    position:absolute;top:8px;right:10px;background:transparent;border:0;color:#B6ADCB;
    font-size:26px;line-height:1;cursor:pointer;padding:4px 8px
  }
  .sheet-word{display:flex;align-items:center;gap:10px}
  .sheet-word span{font-family:var(--body);font-size:25px;font-weight:600}
  .sheet-speak{
    background:var(--amber);border:2px solid var(--ink);color:var(--ink);border-radius:50%;
    width:40px;height:40px;font-size:16px;cursor:pointer;flex:0 0 auto;font-weight:700
  }
  .sheet-ja{font-size:18px;margin-top:10px;color:#fff;font-weight:500}
  .sheet-ja.none{font-size:14px;color:#B6ADCB;font-weight:400}

  .vocab-word{font-family:var(--body);font-size:34px;font-weight:600;text-align:center;margin:20px 0}
  .vocab-ja{font-size:21px;font-weight:700;text-align:center;margin-bottom:20px;min-height:30px}

  /* ---------- linking ---------- */
  .link-card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:10px}
  .link-en{font-family:var(--body);font-size:20px;font-weight:500;color:var(--ink)}
  .link-arrow{color:var(--mute);font-size:12px;margin:8px 0 2px}
  .link-kana{font-size:23px;font-weight:700;color:var(--ink);letter-spacing:.04em}
  .link-ex{font-family:var(--body);font-size:16px;margin-top:14px;line-height:1.5}
  .link-ja{font-size:13px;color:var(--mute);margin-top:4px}
  .link-score{
    font-family:var(--board);font-size:22px;font-weight:700;color:var(--ok);
    text-align:right;min-height:10px;margin-top:6px
  }
  .hidden{display:none !important}
  .center{text-align:center}
  .muted{color:var(--mute);font-size:13px;line-height:1.7}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Phrase<span>·</span>Gate</div>
    <div class="topbar-right">
      <button class="rate-btn" id="rateBtn">1.0×</button>
      <div class="streak" id="streakBox"></div>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- ============ HOME ============ -->
  <section id="home">
    <div class="board">
      <div class="board-eyebrow">Today's gate</div>
      <div class="flap" id="flapHome"></div>
      <div class="board-sub" id="homeSub"></div>
    </div>

    <div class="label">場面を選ぶ</div>
    <div class="scenes" id="sceneChips"></div>

    <div class="footer-actions">
      <button class="btn amber" id="startBtn">練習を始める</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="readModeBtn">英語の文章を読む</button>
      <button class="btn ghost" id="vocabBtn">覚えた単語</button>
    </div>
    <div class="footer-actions" style="margin-top:10px">
      <button class="btn ghost" id="linkModeBtn">つながる音（リンキング）</button>
    </div>
    <p class="muted" style="margin-top:14px">
      聞く → 並べ替える → 声に出す、の3段で1フレーズ。<br>
      「できた」を押すと次に出る間隔が伸びます（1日 → 2日 → 4日 …）。
    </p>
  </section>

  <!-- ============ SESSION ============ -->
  <section id="session" class="hidden">
    <div class="board">
      <div class="board-eyebrow" id="sesEyebrow">Now boarding</div>
      <div class="flap" id="flapSes"></div>
      <div class="board-sub" id="sesSub"></div>
      <div class="progress"><i id="bar"></i></div>
    </div>

    <!-- step 1 -->
    <div class="step" id="step1" data-state="active">
      <div class="step-head">
        <div class="step-num">1</div>
        <div class="step-title">聞く</div>
        <div class="step-note" id="note1"></div>
      </div>
      <div class="step-body">
        <p class="ja-big" id="jaText"></p>
        <div class="row">
          <button class="btn ghost" id="playBtn">▶ 聞く</button>
          <button class="btn ghost" id="slowBtn">▶ ゆっくり</button>
        </div>
        <div class="footer-actions">
          <button class="btn" id="toStep2">英文を見て声に出す</button>
        </div>
        <p class="notice">まず音と意味だけで、言えそうか試してみてください。</p>
      </div>
    </div>

    <!-- step 2 -->
    <div class="step" id="step2" data-state="locked">
      <div class="step-head">
        <div class="step-num">2</div>
        <div class="step-title">声に出す</div>
        <div class="step-note" id="note2"></div>
      </div>
      <div class="step-body">
        <p class="en-big" id="enText"></p>
        <p class="ja-sub" id="jaText2"></p>
        <button class="btn ghost" id="playBtn2" style="margin-bottom:10px">▶ お手本を聞く</button>
        <button class="mic" id="micBtn">● 話す</button>
        <div class="score hidden" id="scoreBox">
          <div class="score-num" id="scoreNum">0</div>
          <div class="muted">一致率</div>
          <div class="heard" id="heardText"></div>
        </div>
        <p class="notice hidden" id="micNotice"></p>
      </div>
    </div>

    <div class="footer-actions row" id="judgeRow">
      <button class="btn ghost" id="againBtn">もう一度</button>
      <button class="btn amber" id="okBtn">できた</button>
    </div>
    <div class="center" style="margin-top:14px">
      <button class="btn ghost small" id="quitBtn">中断してもどる</button>
    </div>
  </section>

  <!-- ============ DONE ============ -->
  <section id="done" class="hidden">
    <div class="board">
      <div class="board-eyebrow">Arrived</div>
      <div class="flap" id="flapDone"></div>
      <div class="board-sub" id="doneSub"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <p class="ja-big" id="doneMsg" style="margin-bottom:8px"></p>
      <p class="muted" id="doneDetail"></p>
    </div>
    <div class="footer-actions">
      <button class="btn amber" id="homeBtn">ホームにもどる</button>
    </div>
  </section>

  <!-- ============ READ (list) ============ -->
  <section id="read" class="hidden">
    <div class="board">
      <div class="board-eyebrow">Reading</div>
      <div class="flap" id="flapRead"></div>
      <div class="board-sub">わからない単語をタップすると意味が出ます</div>
    </div>
    <div class="label">読む文章を選ぶ</div>
    <div id="storyList"></div>
    <div class="footer-actions">
      <button class="btn ghost" id="readBack">ホームにもどる</button>
    </div>
  </section>

  <!-- ============ STORY ============ -->
  <section id="story" class="hidden">
    <div class="card" style="margin-top:14px">
      <div class="story-title" id="storyTitle"></div>
      <div class="story-ja" id="storyJa"></div>
      <div class="reader" id="reader"></div>
    </div>
    <div class="shadowbar">
      <div class="shadow-top">
        <div class="shadow-count" id="shadowCount">1 / 1</div>
        <button class="ja-toggle" id="jaToggle">訳を隠す</button>
        <div class="shadow-score" id="shadowScore"></div>
      </div>
      <div class="shadow-ja" id="shadowJa"></div>
      <div class="shadow-idm" id="shadowIdm"></div>
      <div class="row">
        <button class="sbtn nav" id="prevSent">◀</button>
        <button class="sbtn" id="playSent">▶ 聞く</button>
        <button class="sbtn main" id="repeatSent">● 真似して言う</button>
        <button class="sbtn nav" id="nextSent">▶</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost small" id="readAloud">▶ 通して聞く</button>
      <button class="btn ghost small" id="stopAloud">■ 止める</button>
    </div>
    <div class="footer-actions">
      <button class="btn ghost" id="storyBack">文章の一覧にもどる</button>
    </div>
  </section>

  <!-- ============ VOCAB ============ -->
  <section id="vocab" class="hidden">
    <div class="board">
      <div class="board-eyebrow">Word cards</div>
      <div class="flap" id="flapVocab"></div>
      <div class="board-sub" id="vocabSub"></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="vocab-word" id="vocabWord"></div>
      <div class="vocab-ja" id="vocabJa"></div>
      <button class="btn ghost" id="vocabReveal">意味を見る</button>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost" id="vocabAgain">もう一度</button>
        <button class="btn amber" id="vocabOk">できた</button>
      </div>
    </div>
    <div class="footer-actions">
      <button class="btn ghost" id="vocabBack">ホームにもどる</button>
    </div>
  </section>
  <!-- ============ LINKING ============ -->
  <section id="link" class="hidden">
    <div class="board">
      <div class="board-eyebrow">Linking</div>
      <div class="flap" id="flapLink"></div>
      <div class="board-sub">単語がくっつくと、こう聞こえます</div>
    </div>
    <div class="label">音の種類</div>
    <div class="scenes" id="linkChips"></div>
    <div id="linkList"></div>
    <div class="footer-actions">
      <button class="btn ghost" id="linkBack">ホームにもどる</button>
    </div>
  </section>

</main>

<!-- ============ 単語のポップアップ ============ -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-inner">
    <button class="sheet-close" id="sheetClose">×</button>

const KEY = 'phrasegate.v1';
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];   // レベル別 次回までの日数
const SESSION_SIZE = 10;

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const addDays = (n) => {
  const d = new Date(); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const dayDiff = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      o.vocab = o.vocab || {};
      o.known = o.known || {};
      return o;
    }
  }catch(e){}
  return {cards:{}, vocab:{}, known:{}, streak:{count:0, last:null}, scene:'all', doneToday:0, doneDate:null};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function cardOf(id){
  if(!state.cards[id]) state.cards[id] = {level:0, due:today(), seen:0};
  return state.cards[id];
}
function duePhrases(sceneId){
  const t = today();
  return PHRASES.filter(p => (sceneId==='all' || p.s===sceneId))
    .filter(p => {
      const c = state.cards[p.id];
      return !c || c.due <= t;
    });
}
function touchStreak(){
  const t = today();
  if(state.streak.last === t) return;
  if(state.streak.last && dayDiff(state.streak.last, t) === 1) state.streak.count++;
  else state.streak.count = 1;
  state.streak.last = t;
  save();
}

/* =========================================================
   3. 音声（読み上げ・認識）
   ========================================================= */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  if(!vs.length) return null;
  return vs.find(v => /US/i.test(v.lang) && /Samantha|Google|Natural|Aria/i.test(v.name))
      || vs.find(v => /US/i.test(v.lang)) || vs[0];
}
if('speechSynthesis' in window){
  voice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { voice = pickVoice(); };
}
const RATES = [0.5, 0.8, 1.0, 1.2, 1.5, 2.0, 3.0];
let rate = 1.0;

function speak(text, mult){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = Math.max(0.4, Math.min(4, rate * (mult || 1)));
  if(!voice) voice = pickVoice();
  if(voice) u.voice = voice;
  speechSynthesis.speak(u);
}

function renderRate(){
  $('rateBtn').textContent = (rate % 1 === 0 ? rate.toFixed(1) : String(rate)) + '×';
}
function cycleRate(){
  const i = RATES.indexOf(rate);
  rate = RATES[(i + 1) % RATES.length];
  state.rate = rate;
  save();
  renderRate();
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recording = false, shadowMode = false;

function normalize(s){
  return s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
}
function lcsLen(a,b){
  const dp = Array.from({length:a.length+1}, () => new Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  }
  return dp[a.length][b.length];
}
function similarity(target, heard){
  const t = normalize(target), h = normalize(heard);
  if(!t.length) return 0;
  return Math.round(lcsLen(t,h) / t.length * 100);
}

   4. スプリットフラップ表示（看板）
   ========================================================= */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function setFlap(el, text){
  el.innerHTML = '';
  text.split('').forEach((ch, i) => {
    const cell = document.createElement('span');
    cell.className = 'flap-cell';
    cell.textContent = ch === ' ' ? '\u00A0' : ch;
    el.appendChild(cell);
    if(!reduceMotion && ch !== ' '){
      let n = 0; const steps = 5 + i*2;
      const timer = setInterval(() => {
        cell.textContent = POOL[Math.floor(Math.random()*POOL.length)];
        if(++n >= steps){ clearInterval(timer); cell.textContent = ch; }
      }, 45);
    }
  });
}

/* ---------- セッション ---------- */
let queue = [], current = null, index = 0, spoke = false;

function startSession(){
  const scene = state.scene || 'all';
  let list = duePhrases(scene);
  if(!list.length){
    // 期限前でも先に進みたいとき：次回が近い順に出す
    list = PHRASES.filter(p => scene==='all' || p.s===scene)
      .sort((a,b) => (cardOf(a.id).due > cardOf(b.id).due ? 1 : -1));
  }
  queue = list.slice(0, SESSION_SIZE);
  if(!queue.length) return;
  index = 0;
  touchStreak();
  if(state.doneDate !== today()){ state.doneDate = today(); state.doneToday = 0; save(); }
  show('session');
  loadCard();
}

function loadCard(){
  current = queue[index];
  spoke = false;
  const scene = SCENES.find(s => s.id === current.s);
  setFlap($('flapSes'), scene.code);
  $('sesSub').innerHTML = `${scene.name} ／ <b>${index+1}</b> / ${queue.length}`;
  $('bar').style.width = (index / queue.length * 100) + '%';

  setStep(1);
  $('jaText').textContent = current.ja;
  $('enText').textContent = current.en;
  $('jaText2').textContent = current.ja;
  $('note1').textContent = '';
  $('note2').textContent = '';
  $('scoreBox').classList.add('hidden');
  $('heardText').textContent = '';
  setTimeout(() => speak(current.en), 250);
}

function setStep(n){
  [1,2].forEach(i => {
    const el = $('step'+i);
    el.dataset.state = i < n ? 'done' : (i === n ? 'active' : 'locked');
  });
  $('judgeRow').classList.toggle('hidden', n < 2);
}

/* ---------- 発話 ---------- */
function setupMic(){
  if(!SR){
    $('micBtn').disabled = true;
    $('micBtn').textContent = '音声認識が使えません';
    $('micNotice').classList.remove('hidden');
    $('micNotice').textContent = 'この端末では音声認識が使えません。お手本を聞いて声に出したら、下の「できた」を押してください。iPhoneの場合は 設定 › 一般 › キーボード の音声入力をオンにすると使えることがあります。';
    return;
  }
  recog = new SR();
  recog.lang = 'en-US';
  recog.interimResults = false;
  recog.maxAlternatives = 3;

  recog.onresult = (e) => {
    const target = miscTarget ? miscTarget
                 : (shadowMode && sentences[sentIndex] ? sentences[sentIndex].text : current.en);
    let best = 0, bestText = '';
    for(let i=0;i<e.results[0].length;i++){
      const t = e.results[0][i].transcript;
      const s = similarity(target, t);
      if(s > best){ best = s; bestText = t; }
    }
    if(miscTarget && miscScoreEl) miscScoreEl.textContent = best + '%';
    else if(shadowMode) $('shadowScore').textContent = best + '%';
    else showScore(best, bestText);
  };
  recog.onerror = (e) => {
    if(miscTarget){ if(miscScoreEl) miscScoreEl.textContent = '—'; stopMisc(); return; }
    if(shadowMode){ stopShadowRec(); return; }
    stopRec();
    $('micNotice').classList.remove('hidden');
    $('micNotice').textContent = e.error === 'not-allowed'
      ? 'マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください。'
      : '聞き取れませんでした。もう一度試してください。';
  };
  recog.onend = () => {
    if(miscTarget) stopMisc();
    else if(shadowMode) stopShadowRec();
    else stopRec();
  };
}
function stopRec(){
  recording = false;
  $('micBtn').classList.remove('rec');
  $('micBtn').textContent = spoke ? '● もう一度話す' : '● 話す';
}
function showScore(score, heard){
  spoke = true;
  $('scoreBox').classList.remove('hidden');
  const num = $('scoreNum');
  num.textContent = score;
  num.className = 'score-num ' + (score >= 80 ? 'good' : score >= 50 ? 'mid' : 'low');
  $('heardText').textContent = heard ? `聞こえた文：${heard}` : '';
  $('note2').textContent = score + '%';
}

/* ---------- 採点して次へ ---------- */
function judge(ok){
  const c = cardOf(current.id);
  c.seen++;
  if(ok){
    c.level = Math.min(c.level + 1, INTERVALS.length - 1);
    c.due = addDays(INTERVALS[c.level]);
    state.doneToday = (state.doneToday || 0) + 1;
  }else{
    c.level = Math.max(0, c.level - 1);
    c.due = today();
    queue.push(current);   // 同じセッションの最後にもう一度
  }
  save();
  index++;
  if(index >= queue.length) finish();
  else loadCard();
}

function finish(){
  show('done');
  setFlap($('flapDone'), 'DONE');
  const t = today();
  const tomorrow = PHRASES.filter(p => state.cards[p.id] && state.cards[p.id].due === addDays(1)).length;
  const remaining = duePhrases(state.scene || 'all').length;
  $('doneSub').innerHTML = `連続 <b>${state.streak.count}</b> 日目`;
  $('doneMsg').textContent = `${state.doneToday} フレーズ、覚えました。`;
  $('doneDetail').innerHTML = remaining
    ? `今日はあと ${remaining} フレーズ残っています。`
    : `明日は ${tomorrow} フレーズが出番です。`;
  $('bar').style.width = '100%';
}

/* =========================================================
   5-B. 読む
   ========================================================= */
let currentStory = null, currentWord = null, aloudQueue = [];

function renderStoryList(){
  setFlap($('flapRead'), 'READ');
  const box = $('storyList');
  box.innerHTML = '';
  STORIES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'story-item';
    b.innerHTML = `<h3>${s.title}</h3><p>${s.ja}</p>`;
    b.onclick = () => openStory(s);
    box.appendChild(b);
  });
  show('read');
}

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
const IDIOM_RE = new RegExp(
  '\\b(' + Object.keys(IDIOMS).sort((a,b)=>b.length-a.length).map(escapeRe).join('|') + ')\\b', 'gi');

function markClass(key){
  if(state.vocab[key]) return 'marked';
  if(state.known[key]) return 'known';
  return '';
}
function appendWords(text, parent){
  text.split(/(\s+)/).forEach(tok => {
    if(!tok) return;
    if(!tok.trim()){ parent.appendChild(document.createTextNode(tok)); return; }
    const key = tok.toLowerCase().replace(/[^a-z']/g,'');
    const span = document.createElement('span');
    span.className = 'w ' + markClass(key);
    span.textContent = tok;
    if(key) span.onclick = (e) => { e.stopPropagation(); openSheet(key, span); };
    parent.appendChild(span);
  });
}
function appendIdiom(text, parent){
  const key = text.toLowerCase();
  const span = document.createElement('span');
  span.className = 'idm ' + markClass(key);
  span.textContent = text;
  span.onclick = (e) => { e.stopPropagation(); openSheet(key, span); };
  parent.appendChild(span);
}

function openStory(s){
  currentStory = s;
  $('storyTitle').textContent = s.title;
  $('storyJa').textContent = s.ja;
  const box = $('reader');
  box.innerHTML = '';
  sentences = [];
  paraJaEls = [];

  s.text.forEach(para => {
    const p = document.createElement('p');
    para.forEach(sn => {
      const sent = document.createElement('span');
      sent.className = 'sent';
      sent.dataset.i = sentences.length;
      let last = 0, m;
      IDIOM_RE.lastIndex = 0;
      while((m = IDIOM_RE.exec(sn.en)) !== null){
        appendWords(sn.en.slice(last, m.index), sent);
        appendIdiom(m[0], sent);
        last = m.index + m[0].length;
      }
      appendWords(sn.en.slice(last), sent);
      p.appendChild(sent);
      p.appendChild(document.createTextNode(' '));
      sentences.push({el:sent, text:sn.en, ja:sn.ja});
    });
    box.appendChild(p);
    const pj = document.createElement('div');
    pj.className = 'para-ja';
    pj.textContent = para.map(sn => sn.ja).join('');
    box.appendChild(pj);
    paraJaEls.push(pj);
  });

  sentIndex = 0;
  applyJaVisibility();
  highlightSentence();
  show('story');
}

/* ---------- 聞いて真似する ---------- */
let sentences = [], sentIndex = 0, paraJaEls = [];
let showJa = (state.showJa !== false);

function applyJaVisibility(){
  paraJaEls.forEach(el => el.classList.toggle('hidden', !showJa));
}

function highlightSentence(){
  sentences.forEach(s => s.el.classList.remove('cur'));
  const cur = sentences[sentIndex];
  if(!cur) return;
  cur.el.classList.add('cur');
  $('shadowCount').textContent = `${sentIndex+1} / ${sentences.length}`;
  $('shadowJa').textContent = showJa ? cur.ja : '';
  const idmBox = $('shadowIdm');
  idmBox.innerHTML = '';
  if(showJa){
    const seen = {};
    let m;
    IDIOM_RE.lastIndex = 0;
    while((m = IDIOM_RE.exec(cur.text)) !== null){
      const k = m[0].toLowerCase();
      if(seen[k]) continue;
      seen[k] = 1;
      const ln = document.createElement('div');
      ln.className = 'ln';
      const b = document.createElement('b');
      b.textContent = m[0];
      const sp = document.createElement('span');
      sp.textContent = IDIOMS[k] || '';
      ln.appendChild(b); ln.appendChild(sp);
      idmBox.appendChild(ln);
    }
  }
  $('jaToggle').textContent = showJa ? '訳を隠す' : '訳を見る';
  $('shadowScore').textContent = '';
  $('prevSent').disabled = sentIndex === 0;
  $('nextSent').disabled = sentIndex === sentences.length - 1;
  cur.el.scrollIntoView({block:'center', behavior: reduceMotion ? 'auto' : 'smooth'});
}
function moveSentence(d){
  sentIndex = Math.max(0, Math.min(sentences.length - 1, sentIndex + d));
  highlightSentence();
}
function repeatSentence(){
  const cur = sentences[sentIndex];
  if(!cur || !recog) return;
  if(recording){ recog.stop(); return; }
  shadowMode = true;
  $('shadowScore').textContent = '';
  try{
    recog.start();
    recording = true;
    $('repeatSent').classList.add('rec');
    $('repeatSent').textContent = '● 聞いています…';
  }catch(e){ stopShadowRec(); }
}
function stopShadowRec(){
  recording = false;
  shadowMode = false;
  $('repeatSent').classList.remove('rec');
  $('repeatSent').textContent = '● 真似して言う';
}

function openSheet(key, span){
  currentWord = {key, span};
  $('sheetTerm').textContent = key;
  const ja = meaningOf(key);
  const jaBox = $('sheetJa');
  if(ja){ jaBox.textContent = ja; jaBox.className = 'sheet-ja'; }
  else { jaBox.textContent = '意味は登録されていません'; jaBox.className = 'sheet-ja none'; }
  $('sheet').classList.remove('hidden');
  speak(key, 0.95);
}
function closeSheet(){
  $('sheet').classList.add('hidden');
  currentWord = null;
}

/* 通して聞く：段落ごとに順番に読み上げる */
function readAloud(){
  if(!currentStory) return;
  speechSynthesis.cancel();
  currentStory.text.forEach(para => {
    const u = new SpeechSynthesisUtterance(para.map(sn => sn.en).join(' '));
    u.lang = 'en-US'; u.rate = rate;
    if(!voice) voice = pickVoice();
    if(voice) u.voice = voice;
    speechSynthesis.speak(u);
  });
}

/* =========================================================
   5-C. 単語カード
   ========================================================= */
let vocabQueue = [], vocabCurrent = null;

function dueVocab(){
  const t = today();
  return Object.keys(state.vocab).filter(w => state.vocab[w].due <= t);
}
function startVocab(){
  setFlap($('flapVocab'), 'WORDS');
  const all = Object.keys(state.vocab);
  if(!all.length){
    show('vocab');
    $('vocabSub').textContent = 'まだ単語がありません';
    $('vocabWord').textContent = '—';
    $('vocabJa').textContent = '';
    $('vocabReveal').classList.add('hidden');
    return;
  }
  vocabQueue = dueVocab();
  if(!vocabQueue.length) vocabQueue = all.slice(0, 10);
  $('vocabReveal').classList.remove('hidden');
  show('vocab');
  nextVocab();
}
function nextVocab(){
  if(!vocabQueue.length){
    $('vocabSub').textContent = '今日の分は終わりです';
    $('vocabWord').textContent = 'OK';
    $('vocabJa').textContent = '';
    $('vocabReveal').classList.add('hidden');
    return;
  }
  vocabCurrent = vocabQueue[0];
  $('vocabSub').innerHTML = `のこり <b>${vocabQueue.length}</b> 語`;
  $('vocabWord').textContent = vocabCurrent;
  $('vocabJa').textContent = '';
  speak(vocabCurrent, 0.95);
}
function judgeVocab(ok){
  if(!vocabCurrent) return;
  const v = state.vocab[vocabCurrent];
  if(ok){
    v.level = Math.min((v.level || 0) + 1, INTERVALS.length - 1);
    v.due = addDays(INTERVALS[v.level]);
    vocabQueue.shift();
  }else{
    v.level = 0;
    v.due = today();
    vocabQueue.push(vocabQueue.shift());
  }
  save();
  nextVocab();
}

/* =========================================================
   5-D. つながる音
   ========================================================= */
let linkRule = 'all';

function renderLink(){
  setFlap($('flapLink'), 'LINK');
  const chips = $('linkChips');
  chips.innerHTML = '';
  [{id:'all', name:'すべて'}].concat(LINK_RULES).forEach(r => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.setAttribute('aria-pressed', String(r.id === linkRule));
    const n = r.id === 'all' ? LINKS.length : LINKS.filter(x => x.r === r.id).length;
    b.innerHTML = `${r.name}<small>${n}</small>`;
    b.onclick = () => { linkRule = r.id; renderLink(); };
    chips.appendChild(b);
  });

  const list = $('linkList');
  list.innerHTML = '';
  LINKS.filter(x => linkRule === 'all' || x.r === linkRule).forEach(item => {
    const rule = LINK_RULES.find(r => r.id === item.r);
    const card = document.createElement('div');
    card.className = 'link-card';

    const en = document.createElement('div');
    en.className = 'link-en'; en.textContent = item.en;

    const arrow = document.createElement('div');
    arrow.className = 'link-arrow'; arrow.textContent = `▼ ${rule.name}（${rule.sub}）`;

    const kana = document.createElement('div');
    kana.className = 'link-kana'; kana.textContent = item.kana;

    const ex = document.createElement('div');
    ex.className = 'link-ex'; ex.textContent = item.ex;

    const ja = document.createElement('div');
    ja.className = 'link-ja'; ja.textContent = item.ja;

    const row = document.createElement('div');
    row.className = 'row'; row.style.marginTop = '12px';

    const bSlow = document.createElement('button');
    bSlow.className = 'btn ghost small'; bSlow.textContent = '▶ ゆっくり';
    bSlow.onclick = () => speak(item.ex, 0.6);

    const bNorm = document.createElement('button');
    bNorm.className = 'btn ghost small'; bNorm.textContent = '▶ ふつう';
    bNorm.onclick = () => speak(item.ex, 1.25);

    const score = document.createElement('div');
    score.className = 'link-score';

    const bRep = document.createElement('button');
    bRep.className = 'btn amber small'; bRep.textContent = '● まねする';
    bRep.onclick = () => startMisc(item.ex, score, bRep);

    row.appendChild(bSlow); row.appendChild(bNorm); row.appendChild(bRep);
    [en, arrow, kana, ex, ja, row, score].forEach(el => card.appendChild(el));
    list.appendChild(card);
  });
  show('link');
}

/* 一覧の中から声を出して比べる */
let miscTarget = null, miscScoreEl = null, miscBtn = null;

function startMisc(text, scoreEl, btn){
  if(!recog){ scoreEl.textContent = 'マイク不可'; return; }
  if(recording){ recog.stop(); return; }
  miscTarget = text; miscScoreEl = scoreEl; miscBtn = btn;
  scoreEl.textContent = '';
  try{
    recog.start();
    recording = true;
    btn.textContent = '● 聞いています…';
  }catch(e){ stopMisc(); }
}
function stopMisc(){
  recording = false;
  if(miscBtn) miscBtn.textContent = '● まねする';
  miscTarget = null; miscBtn = null;
}

/* =========================================================
   6. 配線
   ========================================================= */
$('startBtn').onclick = () => { speak(' '); startSession(); };  // iOSの音声解錠を兼ねる
$('playBtn').onclick  = () => speak(current.en);
$('playBtn2').onclick = () => speak(current.en);
$('slowBtn').onclick  = () => speak(current.en, 0.7);
$('toStep2').onclick  = () => setStep(2);
$('micBtn').onclick = () => {
  if(!recog) return;
  if(recording){ recog.stop(); return; }
  $('micNotice').classList.add('hidden');
  try{
    recog.start();
    recording = true;
    $('micBtn').classList.add('rec');
    $('micBtn').textContent = '● 聞いています…（押すと停止）';
  }catch(e){ stopRec(); }
};
$('okBtn').onclick    = () => judge(true);
$('againBtn').onclick = () => judge(false);
$('quitBtn').onclick  = () => { speechSynthesis.cancel(); show('home'); renderHome(); };
$('homeBtn').onclick  = () => { show('home'); renderHome(); };

/* 読む */
$('readModeBtn').onclick = () => { speak(' '); renderStoryList(); };
$('readBack').onclick    = () => { speechSynthesis.cancel(); show('home'); renderHome(); };
$('storyBack').onclick   = () => { speechSynthesis.cancel(); closeSheet(); renderStoryList(); };
$('readAloud').onclick   = readAloud;
$('stopAloud').onclick   = () => speechSynthesis.cancel();
$('playSent').onclick    = () => { const c = sentences[sentIndex]; if(c) speak(c.text); };
$('repeatSent').onclick  = repeatSentence;
$('prevSent').onclick    = () => moveSentence(-1);
$('nextSent').onclick    = () => moveSentence(1);
$('jaToggle').onclick    = () => {
  showJa = !showJa;
  state.showJa = showJa;
  save();
  applyJaVisibility();
  highlightSentence();
};

/* 単語のポップアップ */
$('sheetClose').onclick = closeSheet;
$('sheetSpeak').onclick = () => { if(currentWord) speak(currentWord.key, 0.95); };
$('knowBtn').onclick = () => {
  if(!currentWord) return;
  state.known[currentWord.key] = 1;
  delete state.vocab[currentWord.key];
  save();
  currentWord.span.classList.remove('marked');
  currentWord.span.classList.add('known');
  closeSheet();
};
$('learnBtn').onclick = () => {
  if(!currentWord) return;
  state.vocab[currentWord.key] = {level:0, due:today()};
  delete state.known[currentWord.key];
  save();
  currentWord.span.classList.remove('known');
  currentWord.span.classList.add('marked');
  closeSheet();
};

/* 単語カード */
$('vocabBtn').onclick    = () => { speak(' '); startVocab(); };
$('vocabBack').onclick   = () => { speechSynthesis.cancel(); show('home'); renderHome(); };
$('vocabReveal').onclick = () => {
  if(vocabCurrent) $('vocabJa').textContent = meaningOf(vocabCurrent) || '（意味未登録）';
};
$('vocabOk').onclick    = () => judgeVocab(true);
$('vocabAgain').onclick = () => judgeVocab(false);

$('linkModeBtn').onclick = () => { speak(' '); renderLink(); };
$('linkBack').onclick    = () => { speechSynthesis.cancel(); show('home'); renderHome(); };

setupMic();
if(RATES.indexOf(state.rate) >= 0) rate = state.rate;
renderRate();
$('rateBtn').onclick = cycleRate;
renderHome();
</script>
